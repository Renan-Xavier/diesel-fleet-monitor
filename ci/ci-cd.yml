name: CI/CD Pipeline - Diesel Fleet Monitor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------
  # ETAPA 1: Testes Automatizados e Análise de Qualidade de Código (Lint)
  # --------------------------------------------------------------------------
  test-and-lint:
    name: 🧪 Run Tests & Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Unit & Integration Tests (Pytest)
        run: |
          pytest -v --junitxml=test-results.xml

  # --------------------------------------------------------------------------
  # ETAPA 2: Build da Imagem Docker e Análise de Segurança (DevSecOps)
  # --------------------------------------------------------------------------
  docker-build-and-security:
    name: 🐳 Build Docker Image & Security Scan
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-scan'
          format: 'table'
          exit-code: '0' # Permite continuar mesmo com alertas na fase de aprendizado
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # --------------------------------------------------------------------------
  # ETAPA 3: Publicação da Imagem no GitHub Container Registry (GHCR)
  # --------------------------------------------------------------------------
  publish-container:
    name: 🚀 Publish Docker Image to GHCR
    needs: docker-build-and-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # ETAPA 4: Gatilho de Deploy (CD) - Opcional via Webhook
  # --------------------------------------------------------------------------
  deploy-notification:
    name: 📡 Trigger Deploy (CD)
    needs: publish-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook (se configurado)
        run: |
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "Disparando webhook de deploy para nuvem..."
            curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
          else
            echo "Deploy hook não configurado. Imagem pronta no GHCR para deploy manual ou automático via Git!"
          fi
